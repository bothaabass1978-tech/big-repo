    const wantCrouch = input.crouch;
    if (wantCrouch !== p.crouched) {
      // Only stand up if there's headroom.
      if (!wantCrouch) {
        if (!Z.Phys.boxSolid(p.pos, p.radius, C.PLAYER_HEIGHT)) p.crouched = false;
      } else {
        p.crouched = true;
      }
    }
    p.height = p.crouched ? C.PLAYER_HEIGHT_CROUCH : C.PLAYER_HEIGHT;
    const targetEye = p.crouched ? C.EYE_CROUCH : C.EYE_STAND;
    p.eyeH = M.damp(p.eyeH, targetEye, 16, dt);

    // --- sprint ------------------------------------------------------------
    const moveMag = Math.hypot(input.move[0], input.move[1]);
    const wantSprint = input.sprint && moveMag > 0.3 && input.move[1] > 0.25
      && !p.crouched && !w.reloading && w.ads < 0.2 && !p.downed;
    if (wantSprint && !p.sprintLocked && p.sprintMeter > 0.02) {
      p.sprinting = true;
      p.sprintMeter = Math.max(0, p.sprintMeter - dt / B.sprintDuration);
      if (p.sprintMeter <= 0) { p.sprinting = false; p.sprintLocked = true; }
    } else {
      p.sprinting = false;
      // recovers slower than it drains, so sprint is a resource
      p.sprintMeter = Math.min(1, p.sprintMeter + dt / (B.sprintDuration * B.sprintRegenRatio));
      if (p.sprintMeter > 0.32) p.sprintLocked = false;
    }

    // --- desired speed -----------------------------------------------------
    let speed = B.speedWalk;
    if (p.downed) speed = 1.15;
    else if (p.crouched) speed = B.speedCrouch;
    else if (p.sprinting) speed = B.speedSprint;
    if (w.ads > 0.05 && !p.sprinting) speed = M.lerp(speed, B.speedAds, Z.W.easeAds(w.ads));
    if (w.reloading) speed *= 0.94;
    speed *= (p.speedMult || 1);

    // --- wish direction in world space ------------------------------------
    const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw);
    // forward = (-sin, 0, -cos), right = (cos, 0, -sin)
    let wx = (-sy) * input.move[1] + cy * input.move[0];
    let wz = (-cy) * input.move[1] + (-sy) * input.move[0];
    const wl = Math.hypot(wx, wz);
    if (wl > 0.0001) { wx /= wl; wz /= wl; }
    const wish = Math.min(1, moveMag) * speed;

    // --- accelerate --------------------------------------------------------
    const accel = p.onGround ? GROUND_ACCEL : AIR_ACCEL;
    if (wl > 0.0001) {
      // project current velocity onto the wish direction (Quake-style accel,
      // clamped so you can never exceed the stance cap)
      const cur = p.vel[0] * wx + p.vel[2] * wz;
      const add = Math.min(wish - cur, accel * dt * (p.onGround ? 1 : 0.55));
      if (add > 0) { p.vel[0] += wx * add; p.vel[2] += wz * add; }
    }

    // --- friction ----------------------------------------------------------
    const spd = Math.hypot(p.vel[0], p.vel[2]);
    if (spd > 0.0001) {
      const f = p.onGround ? GROUND_FRICTION : AIR_FRICTION;
      const drop = Math.max(spd, 2.0) * f * dt;
      const k = Math.max(0, spd - drop) / spd;
      // Don't fight the player's own input: only bleed off the component that
      // isn't wished for. This is what stops CoD movement feeling icy.
      if (wl < 0.0001) { p.vel[0] *= k; p.vel[2] *= k; }
      else if (spd > wish) { p.vel[0] *= k; p.vel[2] *= k; }
    }

    // --- jump --------------------------------------------------------------
    if (input.jump && p.onGround && !p.crouched && !p.downed) {
      p.vel[1] = B.jumpVel;
      p.onGround = false;
      if (Z.Audio && Z.Audio.ready) Z.Audio.play('plr_jump', { vol: 0.5 });
    }

    // --- gravity + integrate ----------------------------------------------
    p.vel[1] -= C.GRAVITY * dt;
    if (p.vel[1] < -55) p.vel[1] = -55;
    p.wasOnGround = p.onGround;
    const fallSpeed = -p.vel[1];
    Z.Phys.move(p, dt);

    if (!p.wasOnGround && p.onGround) {
      // landed
      const hard = fallSpeed > 9;
      p.landDipV -= M.clamp(fallSpeed * 0.011, 0.01, 0.16);
      Z.W.notifyLanded(fallSpeed);
      if (Z.Audio && Z.Audio.ready) {
        Z.Audio.play(hard ? 'plr_land_hard' : 'plr_land', { vol: hard ? 0.85 : 0.5 });
      }
      if (hard) Z.FX.shake(M.clamp(fallSpeed * 0.03, 0.1, 0.6), 0.22);
      // Falls in this map are short by design — no fall damage under 6 m.
      if (fallSpeed > 17) P.damage(p, Math.round((fallSpeed - 17) * 7), null, 'fall');

    // --- view bob + footsteps ---------------------------------------------
    const hspd = Math.hypot(p.vel[0], p.vel[2]);
    const moveFrac = M.clamp01(hspd / B.speedSprint);
    if (p.onGround) {
      p.bobPhase += dt * (5.6 + moveFrac * 6.2) * moveFrac;
      p.stepDist += hspd * dt;

    const bobAmp = moveFrac * (p.crouched ? 0.012 : 0.026) * M.lerp(1, 0.3, Z.W.easeAds(w.ads));

    p.viewBob[1] = -Math.abs(Math.cos(p.bobPhase)) * bobAmp;

    const stride = p.sprinting ? 2.05 : (p.crouched ? 1.5 : 1.75);
    if (p.onGround && p.stepDist > stride) {
      p.stepDist = 0;
      P.footstep(p);
    }

    p.landDipV -= p.landDip * 210 * dt;
    p.landDipV *= Math.exp(-10 * dt);
    p.landDip += p.landDipV * dt;

    p.timeAlive += dt;
  };

    wood: 'plr_step_wood', plaster: 'plr_step_wood', brick: 'plr_step_concrete',
    concrete: 'plr_step_concrete', metal: 'plr_step_concrete', dirt: 'plr_step_dirt',
  };
  P.footstep = function (p) {
    if (!Z.Audio || !Z.Audio.ready) return;
    let kind = 'wood';
    if (p.groundBrush) kind = Z.W.impactKind(p.groundBrush.mat || 'wood_floor');
    const base = FOOT_MAT[kind] || 'plr_step_wood';
    const n = 1 + ((Math.random() * 4) | 0);
    Z.Audio.play(base + '_' + n, { pos: p.pos, vol: p.crouched ? 0.28 : 0.55, rate: 0.94 + Math.random() * 0.12 });
  };

  // -------------------------------------------------------------------------
  // Health
  // -------------------------------------------------------------------------
  P.effectiveMaxHealth = function (p) {
    const jug = Z.B.getPerk ? Z.B.getPerk('juggernog') : null;
    if (p.perks.juggernog) return (jug && jug.maxHealth) || 250;

  // Counted from the live list rather than passed in, so the caller stays a
  // single call and every damage source gets the same crowding rule.
  function attackersNear(p) {
    const list = Z.Zombies && Z.Zombies.list;
    if (!list) return 1;
    const reach = Z.B.PLAYER.zombieAttackRange || 1.72;
    const r2 = (reach + 0.5) * (reach + 0.5);
    let n = 0;
    for (let i = 0; i < list.length; i++) {
      const z = list[i];
      if (z.dying) continue;
      const dx = z.pos[0] - p.pos[0], dy = z.pos[1] - p.pos[1], dz = z.pos[2] - p.pos[2];

  P.damage = function (p, amount, fromPos, source) {
    if (p.dead || amount <= 0) return false;
    if (p.godMode) return false;
    // Two zombies striking on the same tick would take a full-health player
    // straight to downed with nothing they could have done, so hits are spaced
    // out. A flat global cooldown does that but flattens the horde: being
    // boxed in by eight is then exactly as dangerous as being caught by two,
    // which removes the reason to fear a corner. Instead the spacing tightens
    // with the size of the group actually on you, down to a floor that keeps
    // every hit individually reactable.
    const now = p.clock || 0;
    if (source === 'zombie') {
      const B = Z.B.PLAYER;
      const crowd = attackersNear(p);
      const floor = B.damageCooldownMin || B.damageCooldown * 0.55;
      const gap = Math.max(floor, B.damageCooldown - (crowd - 1) * 0.035);
      if ((now - (p.lastHitTime || -99)) < gap) return false;
      p.lastHitTime = now;

    if (p.downed) {

      // spacing above, so a swarm does drain the clock faster than a straggler
      // — but the drain per hit is small enough that the 45 s window is a
      // window, not a formality.
      p.bleedout = Math.max(0, p.bleedout - 1.1);
      return true;
    }

    p.lastDamageTime = p.clock || 0;
    if (fromPos) {
      const ang = Math.atan2(fromPos[0] - p.pos[0], fromPos[2] - p.pos[2]);

      if (p.damageDirs.length > 6) p.damageDirs.shift();

      Z.Audio.play('plr_hurt_' + (1 + ((Math.random() * 3) | 0)), { vol: 0.9 });

    }

    p.crouched = true;
    p.sprinting = false;

    if (P.onDowned) P.onDowned(p);

  P.selfRevive = function (p) {
    if (!p.downed || p.reviveUses <= 0) return false;
    p.reviveUses--;

    p.health = P.effectiveMaxHealth(p);
    p.bleedout = 0;
    p.crouched = false;
    if (Z.Audio && Z.Audio.ready) Z.Audio.play('plr_revive', { vol: 1.0 });

  };

  P.die = function (p) {
    if (p.dead) return;
    p.dead = true;
    p.downed = false;
    if (Z.Audio && Z.Audio.ready) Z.Audio.play('game_over', { vol: 1.0 });
    if (P.onDeath) P.onDeath(p);
  };

  P.updateHealth = function (p, dt) {
    p.clock = (p.clock || 0) + dt;
    for (let i = p.damageDirs.length - 1; i >= 0; i--) {
      p.damageDirs[i].t -= dt;
      if (p.damageDirs[i].t <= 0) p.damageDirs.splice(i, 1);
    }
    if (p.downed) {
      p.bleedout -= dt;
      if (p.bleedout <= 0) P.die(p);
      return;
    }
    if (p.dead) return;
    const B = Z.B.PLAYER;
    const maxH = P.effectiveMaxHealth(p);
    if (p.health < maxH && (p.clock - p.lastDamageTime) > B.regenDelay) {
      p.health = Math.min(maxH, p.health + B.regenRate * (maxH / 100) * dt);
    }
    // ragged breathing under a third health
    const lowFrac = p.health / maxH;
    if (lowFrac < 0.34) {
      p.breathT -= dt;
      if (p.breathT <= 0) {
        p.breathT = M.lerp(0.55, 1.4, lowFrac / 0.34);
        if (Z.Audio && Z.Audio.ready) Z.Audio.play('plr_heartbeat', { vol: 0.55 * (1 - lowFrac) });
      }

  };

  // -------------------------------------------------------------------------
  // Points
  // -------------------------------------------------------------------------
  P.award = function (p, amount, reason) {
    if (amount === 0) return;
    p.points += amount;
    if (p.points < 0) p.points = 0;
    if (Z.HUD && Z.HUD.notify) Z.HUD.notify('points', { amount, reason });
  };
  P.canAfford = (p, cost) => p.points >= cost;
  P.spend = function (p, cost) {
    if (p.points < cost) {
      if (Z.Audio && Z.Audio.ready) Z.Audio.play('buy_fail', { vol: 0.7 });
      return false;
    }
    p.points -= cost;
    if (Z.HUD && Z.HUD.notify) Z.HUD.notify('points', { amount: -cost, reason: 'spend' });
    return true;
  };

  // -------------------------------------------------------------------------
  // Inventory
  // -------------------------------------------------------------------------
  P.MAX_WEAPONS = 2;

  P.giveWeapon = function (p, id, opts) {
    // Already carrying it? Just refill.
    for (let i = 0; i < p.weapons.length; i++) {
      if (p.weapons[i].id === id) {
        Z.W.giveAmmo(p.weapons[i], true);
        p.slot = i;
        return { replaced: false, refilled: true };
      }
    }
    const w = Z.W.make(id, opts);
    if (p.weapons.length < P.MAX_WEAPONS) {
      p.weapons.push(w);
      p.slot = p.weapons.length - 1;
      return { replaced: false, refilled: false };
    }
    const old = p.weapons[p.slot];
    p.weapons[p.slot] = w;
    return { replaced: true, refilled: false, dropped: old.id };
  };

  P.swapSlot = function (p) {
    if (p.weapons.length < 2 || p.swapT > 0) return false;

        p.swapTo = -1;
        p.swapT = 0;

  P.givePerk = function (p, id) {
    if (p.perks[id]) return false;
    p.perks[id] = true;

      p.health = P.effectiveMaxHealth(p);

  // Grenades

// ---------------------------------------------------------------------------
// 17_zombie.js — zombie entities, state machine, damage model, rendering.
//
// The behaviour loop is the one from the original: spawn out in the dark,
// walk to your assigned window, tear the boards off one at a time, climb
// through, then walk at the player forever. Speed and health come from the
// round; everything else is constant. The design relies on the horde being
// predictable — a player must be able to read a group and out-walk it, which
// is why the top speed is capped just under the speed the player can sustain
// indefinitely (not their sprint burst; see B.sustainedPlayerSpeed).
//
// That margin is a speed comparison in open space, and it is only half the
// claim: out-walking a horde also needs somewhere to walk. check-level.mjs
// measures the largest circle you can actually run inside each room, and the
// back rooms are tight on purpose — main and catwalk give 3.9 m, ne and se
// give 1.8-1.9 m. Retreating into a back room is meant to be a mistake, the
// way it is on the real map, so spawn weighting is left free to follow the
// player there. Kiting is always available; it is not available everywhere.
// ---------------------------------------------------------------------------
(function () {
  const S = {};
  Z.Zombies = S;
  const M = Z.M;
  const rng = Z.RNG.make(0x2B1E5);

  const R = 0.34;            // collision radius
  const H = 1.82;            // standing height
  const CRAWL_H = 0.70;

  // Hitbox geometry, as fractions of height.
  const HEAD_Y = 0.855, HEAD_R = 0.175;
  const TORSO_Y0 = 0.42, TORSO_Y1 = 0.80, TORSO_R = 0.28;

  S.list = [];
  S.aliveCount = 0;
  let idCounter = 0;
  let player = null;
  let level = null;

  S.init = function (lv, plr) {
    level = lv;
    player = plr;
    S.list.length = 0;
    S.aliveCount = 0;
    idCounter = 0;
    rng.reseed(0x2B1E5);
    return S;
  };
  S.setPlayer = function (p) { player = p; };

  // -------------------------------------------------------------------------
  // Spawning
  // -------------------------------------------------------------------------
  S.spawn = function (opts) {
    opts = opts || {};
    const round = opts.round || 1;
    const win = opts.window;
    const zone = opts.zone;

    // At the capped sprint tier the spread is downward-only, so no individual
    // zombie can exceed the cap the kiting invariant is built on.
    const band = Z.B.zombieSpeedTier(round).name === 'sprint'
      ? Z.B.zombieSpeedSpreadTop : Z.B.zombieSpeedSpread;
    const spread = M.lerp(band.min, band.max, rng.f());
    const hp = Z.B.roundHealth(round);
    const z = {
      id: ++idCounter,
      pos: zone ? [zone.pos[0], zone.pos[1], zone.pos[2]] : [win.out[0], win.out[1], win.out[2]],
      vel: [0, 0, 0],
      radius: R, height: H, stepUp: 0.46, onGround: false,

      health: hp, maxHealth: hp,
      speed: Z.B.zombieSpeed(round) * spread,
      baseSpeed: Z.B.zombieSpeed(round) * spread,
      round,

      yaw: 0, targetYaw: 0,
      state: 'approach',
      stateT: 0,
      window: win || null,
      variant: rng.i(6),
      seed: rng.f() * 1000,
      helmet: rng.bool(0.35),

      crawler: false,
      limbsMissing: { armL: false, armR: false, legL: false, legR: false, head: false },

      path: null, pathI: 0, repathT: rng.range(0, 0.5),
      goal: null,
      stuckT: 0, lastPos: [0, 0, 0],

      anim: 'shamble', animT: rng.f() * 2,
      attackPhase: 0, attackCooldown: 0, hasHitThisSwing: false,
      stagger: 0,
      moanT: rng.range(0.5, 4),
      stepT: 0,

      dying: false, deathT: 0, deathAnim: 'death_fall_forward',
      dead: false,
      boardsTornT: 0,
      climbT: 0, climbFrom: null, climbTo: null,
      spawnFade: 0.35,
    };
    z.lastPos[0] = z.pos[0]; z.lastPos[1] = z.pos[1]; z.lastPos[2] = z.pos[2];
    // drop onto the ground
    const f = Z.Phys.floorAt([z.pos[0], z.pos[1] + 1.0, z.pos[2]], 4, R);
    if (f !== null) z.pos[1] = f + 0.01;
    S.list.push(z);
    S.aliveCount++;
    if (Z.Audio && Z.Audio.ready) {
      Z.Audio.play('zom_spawn_crawl', { pos: z.pos, vol: 0.4 });
    }
    return z;
  };

  // -------------------------------------------------------------------------
  // Damage
  // -------------------------------------------------------------------------
  // info: { zone:'head'|'torso'|'limb', dir:[3], point:[3], source, weapon }
  S.damage = function (z, amount, info) {
    if (!z || z.dying || z.dead) return { killed: false };
    info = info || {};
    const before = z.health;
    let dmg = amount;
    if (S.instaKill && info.source !== 'fall') dmg = 1e9;
    z.health -= dmg;

    if (info.zone !== 'head') z.stagger = Math.min(0.35, z.stagger + 0.12);

    if (Z.Audio && Z.Audio.ready && info.point) {
      Z.Audio.play(info.zone === 'head' ? 'zom_hit_head' : 'zom_hit_flesh',
        { pos: info.point, vol: 0.75, rate: rng.range(0.92, 1.08) });
    }

    if (z.health > 0) {
      // Explosives that don't kill can take the legs off — the classic crawler.
      if (info.source === 'explosive' && !z.crawler && before - z.health > z.maxHealth * 0.35) {
        if (rng.bool(0.55)) S.makeCrawler(z, info.point || z.pos);
      }
      return { killed: false, damage: dmg };
    }

    // --- killed ------------------------------------------------------------
    const headshot = info.zone === 'head';
    const gib = info.source === 'explosive' || dmg > z.maxHealth * 3.5;
    S.kill(z, {
      headshot, gib, dir: info.dir || [0, 0, 1], point: info.point || z.pos,
      source: info.source || 'bullet',
    });
    return { killed: true, headshot, gib, damage: dmg };
  };

  S.makeCrawler = function (z, at) {
    z.crawler = true;
    z.limbsMissing.legL = true;
    z.limbsMissing.legR = true;
    z.height = CRAWL_H;
    z.anim = 'crawler';
    z.speed = z.baseSpeed * 0.72;
    Z.FX.gib(at || z.pos, 0.7);
    if (Z.Audio && Z.Audio.ready) Z.Audio.play('zom_gib', { pos: z.pos, vol: 0.8 });
  };

  S.kill = function (z, info) {
    if (z.dying || z.dead) return;
    info = info || {};
    z.dying = true;
    z.deathT = 0;
    z.health = 0;
    S.aliveCount--;

    if (info.gib) {
      z.deathAnim = 'death_gib';
      Z.FX.gib(bodyCenter(z), 1.0);
      if (Z.Audio && Z.Audio.ready) Z.Audio.play('zom_gib', { pos: z.pos, vol: 1.0 });
      z.gibbed = true;
    } else if (info.headshot) {
      z.deathAnim = 'death_headshot';
      z.limbsMissing.head = true;
      Z.FX.blood([z.pos[0], z.pos[1] + z.height * HEAD_Y, z.pos[2]], info.dir || [0, 1, 0], 2.2, true);
      if (Z.Audio && Z.Audio.ready) Z.Audio.play('zom_death_' + (1 + rng.i(4)), { pos: z.pos, vol: 0.9 });
    } else {
      const d = info.dir || [0, 0, 1];
      const facing = M.fromAngles([0, 0, 0], z.yaw, 0);
      z.deathAnim = (d[0] * facing[0] + d[2] * facing[2]) > 0 ? 'death_fall_forward' : 'death_fall_back';
      if (Z.Audio && Z.Audio.ready) Z.Audio.play('zom_death_' + (1 + rng.i(4)), { pos: z.pos, vol: 0.85 });
    }

    // Release the window it was working on.
    if (z.window && z.window.tearer === z) z.window.tearer = null;

    if (S.onKill) S.onKill(z, info);
  };

  // Explosive area damage.
  S.splash = function (point, radius, damage, exclude) {
    let hits = 0;
    for (const z of S.list) {
      if (z.dying || z.dead || z === exclude) continue;
      const c = bodyCenter(z);
      const d = M.dist3(point, c);
      if (d > radius) continue;
      // Line of sight so blasts don't reach through walls.
      if (!Z.Phys.losClear(point, c)) continue;
      const falloff = 1 - (d / radius);
      S.damage(z, damage * falloff * falloff, {
        zone: 'torso', source: 'explosive',
        dir: M.norm3([0, 0, 0], [c[0] - point[0], c[1] - point[1], c[2] - point[2]]),
        point: c,
      });
      hits++;
    }
    return hits;
  };

  // Kill everything currently alive (Nuke power-up).
  S.killAll = function (source) {
    let n = 0;
    for (const z of S.list) {
      if (z.dying || z.dead) continue;
      S.kill(z, { gib: false, source: source || 'nuke', dir: [0, 0, 1] });
      n++;
    }
    return n;
  };

  function bodyCenter(z) {
    return [z.pos[0], z.pos[1] + z.height * 0.55, z.pos[2]];
  }
  S.bodyCenter = bodyCenter;

  // -------------------------------------------------------------------------
  // Hit detection — head sphere over a torso/limb capsule
  // -------------------------------------------------------------------------
  const hitOut = { zombie: null, t: 0, point: [0, 0, 0], zone: 'torso' };

  S.rayHit = function (origin, dir, maxDist, ignore) {
    let best = null, bestT = maxDist;
    for (const z of S.list) {
      if (z.dying || z.dead) continue;
      if (ignore && ignore.indexOf(z) !== -1) continue;
      // quick reject on the bounding capsule
      const tBody = Z.Phys.rayCapsule(origin, dir, z.pos, z.radius + 0.06, z.height, bestT);
      if (tBody < 0) continue;

      let zone = 'torso';
      let t = tBody;
      if (!z.crawler && !z.limbsMissing.head) {
        const hy = z.pos[1] + z.height * HEAD_Y;
        const tHead = raySphere(origin, dir, z.pos[0], hy, z.pos[2], HEAD_R, bestT);
        if (tHead >= 0 && tHead <= tBody + 0.35) { zone = 'head'; t = tHead; }
      }
      if (zone === 'torso') {
        // anything outside the torso band counts as a limb (reduced damage)
        const hitY = origin[1] + dir[1] * t - z.pos[1];
        const frac = hitY / z.height;
        if (frac < TORSO_Y0 || frac > TORSO_Y1) zone = 'limb';
      }
      if (t < bestT) {
        bestT = t; best = z;
        hitOut.zone = zone;
      }
    }
    if (!best) return null;
    hitOut.zombie = best;
    hitOut.t = bestT;
    hitOut.point[0] = origin[0] + dir[0] * bestT;
    hitOut.point[1] = origin[1] + dir[1] * bestT;
    hitOut.point[2] = origin[2] + dir[2] * bestT;
    return hitOut;
  };

  function raySphere(o, d, cx, cy, cz, r, maxT) {
    const ox = o[0] - cx, oy = o[1] - cy, oz = o[2] - cz;
    const b = 2 * (ox * d[0] + oy * d[1] + oz * d[2]);
    const c = ox * ox + oy * oy + oz * oz - r * r;
    const disc = b * b - 4 * c;
    if (disc < 0) return -1;
    const sq = Math.sqrt(disc);
    let t = (-b - sq) * 0.5;
    if (t < 0) t = (-b + sq) * 0.5;
    if (t < 0 || t > maxT) return -1;
    return t;
  }

  // -------------------------------------------------------------------------
  // Update
  // -------------------------------------------------------------------------
  const tmpA = [0, 0, 0], tmpB = [0, 0, 0];

  S.lastDt = 1 / 120;
  S.flowT = 0;

  S.update = function (dt, ctx) {
    S.lastDt = dt;
    S.pathBudget = PATHS_PER_TICK;

    // One shared search toward the player, reused by every hunter this tick.
    S.flowT -= dt;
    if (player && !player.dead && (S.flowT <= 0 || Z.Nav.flowGoalMoved(player.pos))) {
      Z.Nav.buildFlow(player.pos);
      S.flowT = 0.35;
    }
    const B = Z.B.PLAYER;
    const playerPos = player ? player.pos : [0, 0, 0];
    const paused = ctx && ctx.paused;

    for (let i = S.list.length - 1; i >= 0; i--) {
      const z = S.list[i];

      if (z.dying) {
        z.deathT += dt;
        // let the body fall for a moment, then fade it out
        z.vel[1] -= Z.C.GRAVITY * dt;
        z.vel[0] *= Math.exp(-6 * dt);
        z.vel[2] *= Math.exp(-6 * dt);
        Z.Phys.move(z, dt);
        if (z.deathT > (z.gibbed ? 0.35 : 3.6)) {
          S.list.splice(i, 1);
        }
        continue;
      }
      if (paused) continue;

      z.stateT += dt;
      z.spawnFade = Math.max(0, z.spawnFade - dt);
      if (z.stagger > 0) z.stagger = Math.max(0, z.stagger - dt * 1.6);
      if (z.attackCooldown > 0) z.attackCooldown = Math.max(0, z.attackCooldown - dt);

      switch (z.state) {
        case 'approach': updateApproach(z, dt); break;
        case 'queue': updateQueue(z, dt); break;
        case 'tear': updateTear(z, dt); break;
        case 'climb': updateClimb(z, dt); break;
        case 'hunt': updateHunt(z, dt, playerPos); break;
        case 'attack': updateAttack(z, dt, playerPos); break;
        default: z.state = 'hunt'; break;
      }

      // moans
      z.moanT -= dt;
      if (z.moanT <= 0) {
        z.moanT = rng.range(2.6, 7.5);
        if (Z.Audio && Z.Audio.ready) {
          const close = M.dist3(z.pos, playerPos) < 9;
          const aggressive = z.speed > 3.0 && close;
          Z.Audio.play(aggressive ? ('zom_scream_' + (1 + rng.i(4))) : ('zom_moan_' + (1 + rng.i(6))),
            { pos: z.pos, vol: aggressive ? 0.8 : 0.55, rate: rng.range(0.86, 1.12) });
        }
      }

      // footsteps
      const hspd = Math.hypot(z.vel[0], z.vel[2]);
      if (hspd > 0.35 && z.onGround) {
        z.stepT -= dt * (0.8 + hspd * 0.45);
        if (z.stepT <= 0) {
          z.stepT = 1;
          if (Z.Audio && Z.Audio.ready && M.dist3(z.pos, playerPos) < 16) {
            Z.Audio.play('zom_step', { pos: z.pos, vol: 0.3, rate: rng.range(0.85, 1.15) });
          }
        }
      }

      z.animT += dt;
      z.yaw = M.angDamp(z.yaw, z.targetYaw, 9, dt);
    }

    // Keep the horde from collapsing into a single point, and keep it out of
    // the player's own space.
    separate(dt);
    separateFromPlayer();
  };

  // Separation moves bodies by direct assignment, which bypasses collision —
  // next to a wall that will happily push a zombie clean through it, and a
  // zombie outside the building has no navigation path back in and is stuck
  // for the rest of the round. So every shove is checked and reverted if it
  // would end up inside geometry.
  const sepSave = [0, 0, 0];
  function shoveSafe(z, dx, dz) {
    sepSave[0] = z.pos[0]; sepSave[2] = z.pos[2];
    z.pos[0] += dx; z.pos[2] += dz;
    if (Z.Phys.boxSolid(z.pos, z.radius * 0.92, z.height * 0.9)) {
      z.pos[0] = sepSave[0]; z.pos[2] = sepSave[2];
      return false;
    }
    return true;
  }

  function separate() {
    const n = S.list.length;
    for (let i = 0; i < n; i++) {
      const a = S.list[i];
      if (a.dying) continue;
      for (let j = i + 1; j < n; j++) {
        const b = S.list[j];
        if (b.dying) continue;
        if (Math.abs(a.pos[1] - b.pos[1]) > 1.4) continue;
        const dx = b.pos[0] - a.pos[0], dz = b.pos[2] - a.pos[2];
        const d2 = dx * dx + dz * dz;
        const rr = a.radius + b.radius;
        if (d2 > rr * rr || d2 < 1e-8) continue;
        const d = Math.sqrt(d2);
        const push = (rr - d) * 0.5 * 0.55;
        const nx = dx / d, nz = dz / d;
        shoveSafe(a, -nx * push, -nz * push);
        shoveSafe(b, nx * push, nz * push);
      }
    }
  }

  // Zombies are solid to the player. Without this they walk straight into
  // your chest, sit at 0.2 m from your centre and beat you to death while you
  // shove uselessly through them — being crowded has to *feel* like being
  // crowded. The player is much heavier than a zombie so a crowd slows and
  // corners you (which is the horror) without ever teleporting you into
  // geometry (which is a bug).
  const PLAYER_PUSH = 0.20;
  const MAX_PUSH_PER_TICK = 0.020;   // metres; ~2.4 m/s of crowd shove at 120 Hz
  const pushAcc = [0, 0];

  function separateFromPlayer() {
    if (!player || player.dead) return;
    const pr = player.radius;
    pushAcc[0] = 0; pushAcc[1] = 0;

    for (const z of S.list) {
      if (z.dying) continue;
      if (z.state === 'climb') continue;                 // mid-window, not solid yet
      if (Math.abs(z.pos[1] - player.pos[1]) > 1.5) continue;
      const dx = z.pos[0] - player.pos[0];
      const dz = z.pos[2] - player.pos[2];
      const rr = z.radius + pr;
      const d2 = dx * dx + dz * dz;
      if (d2 > rr * rr) continue;
      let nx, nz, d;
      if (d2 < 1e-6) {
        // exactly coincident: shove along the zombie's facing so it resolves
        nx = Math.sin(z.yaw); nz = Math.cos(z.yaw); d = 0;
      } else {
        d = Math.sqrt(d2); nx = dx / d; nz = dz / d;
      }
      const overlap = rr - d;
      // The zombie takes almost all of the correction, but never through a wall.
      shoveSafe(z, nx * overlap * (1 - PLAYER_PUSH), nz * overlap * (1 - PLAYER_PUSH));
      pushAcc[0] -= nx * overlap * PLAYER_PUSH;
      pushAcc[1] -= nz * overlap * PLAYER_PUSH;
    }

    // One clamped shove per tick. Without the clamp, ten zombies each pushing
    // a little sums to more than the player's own top speed and the crowd
    // simply freezes you in place — being mobbed should be lethal because you
    // cannot escape the *damage*, not because the physics pins you.
    const mag = Math.hypot(pushAcc[0], pushAcc[1]);
    if (mag < 1e-6) return;
    const k = Math.min(1, MAX_PUSH_PER_TICK / mag);
    const dt = Math.max(1e-4, S.lastDt);
    const ent = {
      pos: player.pos,
      vel: [pushAcc[0] * k / dt, 0, pushAcc[1] * k / dt],
      radius: pr, height: player.height, onGround: player.onGround, stepUp: 0,
    };
    Z.Phys.move(ent, dt);
  }

  // --- movement helper -------------------------------------------------------
  function steerTo(z, target, dt, speedScale) {
    const dx = target[0] - z.pos[0];
    const dz = target[2] - z.pos[2];
    const d = Math.hypot(dx, dz);
    let sp = z.speed * (speedScale === undefined ? 1 : speedScale);
    if (z.stagger > 0) sp *= 1 - z.stagger * 0.55;
    if (d > 0.001) {
      z.targetYaw = Math.atan2(-dx, -dz);
      const nx = dx / d, nz = dz / d;
      // accelerate toward the desired velocity rather than snapping to it
      const wantX = nx * sp, wantZ = nz * sp;
      const k = 1 - Math.exp(-11 * dt);
      z.vel[0] += (wantX - z.vel[0]) * k;
      z.vel[2] += (wantZ - z.vel[2]) * k;
    } else {
      z.vel[0] *= Math.exp(-8 * dt);
      z.vel[2] *= Math.exp(-8 * dt);
    }
    z.vel[1] -= Z.C.GRAVITY * dt;
    Z.Phys.move(z, dt);
    return d;
  }

  // Only zombies walking to a specific window need their own search; hunters
  // all share the flow field, so this stays cheap without rationing.
  S.pathBudget = 0;
  const PATHS_PER_TICK = 6;

  function repath(z, goal) {
    if (S.pathBudget <= 0) {
      z.repathT = Math.min(z.repathT, 0.12);
      return false;
    }
    S.pathBudget--;
    const path = Z.Nav.pathBetween(z.pos, goal, 2400);
    if (path) {
      z.path = Z.Nav.smooth(path, []);
      z.pathI = 0;
      // skip the first node if we're basically standing on it
      if (z.path.length > 1 && M.distXZ(z.pos, [z.path[0].x, 0, z.path[0].z]) < 0.45) z.pathI = 1;
    } else {
      z.path = null;
    }
    z.goal = [goal[0], goal[1], goal[2]];
    return true;
  }

  // Walk downhill on the shared flow field toward the player. Falls back to a
  // direct steer when the field has no answer for this node (just spawned, or
  // standing somewhere the sweep did not reach).
  function followFlow(z, goal, dt) {
    const straight = M.distXZ(z.pos, goal);
    // Close enough to see them: go straight, it looks far more deliberate than
    // stepping between grid nodes.
    if (straight < 3.0 && Math.abs(z.pos[1] - goal[1]) < 1.2
        && Z.Phys.losClear([z.pos[0], z.pos[1] + 1.0, z.pos[2]], [goal[0], goal[1] + 1.0, goal[2]])) {
      steerTo(z, goal, dt, 1);
      trackProgress(z, dt);
      return straight;
    }
    const next = Z.Nav.flowStep(z.pos);
    if (!next) { steerTo(z, goal, dt, 1); trackProgress(z, dt); return straight; }
    tmpA[0] = next.x; tmpA[1] = next.y; tmpA[2] = next.z;
    steerTo(z, tmpA, dt, 1);
    trackProgress(z, dt);
    return straight;
  }

  function trackProgress(z, dt) {
    const moved = M.distXZ(z.pos, z.lastPos);
    if (moved < 0.02) {
      z.stuckT += dt;
      if (z.stuckT > 0.75) {
        z.stuckT = 0;
        z.vel[0] += rng.sym(1.6);
        z.vel[2] += rng.sym(1.6);
      }
    } else {
      z.stuckT = 0;
    }
    z.lastPos[0] = z.pos[0]; z.lastPos[1] = z.pos[1]; z.lastPos[2] = z.pos[2];
  }

  // Follow the current path; returns distance remaining to the final goal.
  function followPath(z, goal, dt, speedScale) {
    z.repathT -= dt;
    const goalMoved = !z.goal || M.dist3sq(z.goal, goal) > 2.5;
    if (z.repathT <= 0 || goalMoved || !z.path) {
      repath(z, goal);
      z.repathT = rng.range(0.55, 1.05);
    }
    if (!z.path || z.pathI >= z.path.length) {
      return steerTo(z, goal, dt, speedScale);
    }
    const node = z.path[z.pathI];
    tmpA[0] = node.x; tmpA[1] = node.y; tmpA[2] = node.z;
    const d = M.distXZ(z.pos, tmpA);
    if (d < 0.42 && Math.abs(z.pos[1] - node.y) < 1.2) {
      z.pathI++;
      if (z.pathI >= z.path.length) return steerTo(z, goal, dt, speedScale);
    }
    steerTo(z, tmpA, dt, speedScale);

    // stuck detection: if we've barely moved while trying to, force a repath
    const moved = M.distXZ(z.pos, z.lastPos);
    if (moved < 0.02) {
      z.stuckT += dt;
      if (z.stuckT > 0.75) {
        z.stuckT = 0;
        z.repathT = 0;
        // nudge sideways to break symmetric deadlocks
        z.vel[0] += rng.sym(1.6);
        z.vel[2] += rng.sym(1.6);
      }
    } else {
      z.stuckT = 0;
    }
    z.lastPos[0] = z.pos[0]; z.lastPos[1] = z.pos[1]; z.lastPos[2] = z.pos[2];
    return M.distXZ(z.pos, goal);
  }

  // --- states ---------------------------------------------------------------
  function updateApproach(z, dt) {
    const w = z.window;
    if (!w) { z.state = 'hunt'; return; }
    z.anim = animForSpeed(z);
    const d = followPath(z, w.out, dt, 1);
    // Same watchdog as hunting: no headway toward the window for long enough
    // means this one can't get there and needs a different way in.
    if (z.approachBest === undefined || d < z.approachBest - 0.25) {
      z.approachBest = d;
      z.approachStuckT = 0;
    } else {
      z.approachStuckT = (z.approachStuckT || 0) + dt;
      if (z.approachStuckT > 9.0) {
        z.approachBest = undefined;
        z.approachStuckT = 0;
        recoverStuckHunter(z, player ? player.pos : z.pos);
        return;
      }
    }
    if (d < 1.0) {
      z.state = w.boards > 0 ? 'queue' : 'climb';
      z.stateT = 0;
      if (z.state === 'climb') beginClimb(z);
    }
  }

  function updateQueue(z, dt) {
    const w = z.window;
    if (!w) { z.state = 'hunt'; return; }
    if (w.boards <= 0) { beginClimb(z); return; }
    // One zombie works the barricade at a time; the rest crowd behind it.
    if (!w.tearer || w.tearer.dead || w.tearer.dying) w.tearer = z;
    if (w.tearer === z) {
      z.state = 'tear';
      z.stateT = 0;
      z.boardsTornT = tearTime(z);
      z.anim = 'tear_board';
      return;
    }
    // shuffle in place near the window
    const jitter = [
      w.out[0] + Math.sin(z.seed + z.stateT * 0.6) * 0.9,
      w.out[1],
      w.out[2] + Math.cos(z.seed * 1.7 + z.stateT * 0.5) * 0.9,
    ];
    z.anim = 'shamble';
    steerTo(z, jitter, dt, 0.35);
    faceTowards(z, w.pos);
  }

  function tearTime(z) {
    return Z.B.boardTearTime ? Z.B.boardTearTime(z.round)
      : M.lerp(Z.B.BARRICADE.tearTimePerBoardBase, Z.B.BARRICADE.tearTimePerBoardMin,
        M.clamp01((z.round - 1) / (Z.B.BARRICADE.tearTimeRoundsToMin - 1)));
  }

  function updateTear(z, dt) {
    const w = z.window;
    if (!w) { z.state = 'hunt'; return; }
    if (w.boards <= 0) { beginClimb(z); return; }
    if (w.tearer !== z) { z.state = 'queue'; return; }
    z.anim = 'tear_board';
    faceTowards(z, w.pos);
    // hold position at the window
    steerTo(z, w.out, dt, 0.25);
    z.boardsTornT -= dt;
    if (z.boardsTornT <= 0) {
      w.boards = Math.max(0, w.boards - 1);
      z.boardsTornT = tearTime(z);
      const at = w.boardSlots[w.boards] ? w.boardSlots[w.boards].pos : w.pos;
      Z.FX.splinters(at, w.normal, 9);
      if (Z.Audio && Z.Audio.ready) {
        Z.Audio.play('zom_board_pull_' + (1 + rng.i(3)), { pos: at, vol: 1.0, rate: rng.range(0.9, 1.1) });
      }
      if (S.onBoardTorn) S.onBoardTorn(w, z);
      if (w.boards <= 0) { w.tearer = null; beginClimb(z); }
    }
  }

  function beginClimb(z) {
    const w = z.window;
    z.state = 'climb';
    z.stateT = 0;
    z.anim = 'climb';
    z.climbT = 0;
    z.climbFrom = [z.pos[0], z.pos[1], z.pos[2]];
    z.climbTo = [w.inPos[0], w.floorY + 0.01, w.inPos[2]];
    z.climbApex = [
      (z.climbFrom[0] + z.climbTo[0]) * 0.5,
      Math.max(z.climbFrom[1], z.climbTo[1]) + (w.floorY > 0.5 ? w.floorY * 0.55 + 0.9 : 1.05),
      (z.climbFrom[2] + z.climbTo[2]) * 0.5,
    ];
    // Upstairs windows take longer: they're scaling a wall, not stepping over.
    z.climbDur = w.floorY > 0.5 ? 2.6 : 1.45;
    if (w.tearer === z) w.tearer = null;
    if (Z.Audio && Z.Audio.ready) Z.Audio.play('zom_spawn_crawl', { pos: z.pos, vol: 0.7 });
  }

  function updateClimb(z, dt) {
    z.climbT += dt;
    const t = M.clamp01(z.climbT / z.climbDur);
    // quadratic bezier through the apex so they visibly haul themselves up
    const it = 1 - t;
    const a = z.climbFrom, b = z.climbApex, c = z.climbTo;
    z.pos[0] = it * it * a[0] + 2 * it * t * b[0] + t * t * c[0];
    z.pos[1] = it * it * a[1] + 2 * it * t * b[1] + t * t * c[1];
    z.pos[2] = it * it * a[2] + 2 * it * t * b[2] + t * t * c[2];
    z.vel[0] = z.vel[1] = z.vel[2] = 0;
    faceTowards(z, [c[0] + (c[0] - a[0]), c[1], c[2] + (c[2] - a[2])]);
    if (t >= 1) {
      z.state = 'hunt';
      z.stateT = 0;
      z.window = null;
      z.onGround = true;
      z.repathT = 0;
    }
  }

  // A hunter that makes no headway for long enough has gone wrong somehow —
  // shoved outside the building, wedged on geometry, or cut off by a door
  // that closed. Rather than leave it to hang the round forever, send it back
  // to a barricade and let it come in again.
  const NO_PROGRESS_REPATH = 4.0;
  const NO_PROGRESS_RESET = 11.0;

  function recoverStuckHunter(z, playerPos) {
    const lv = Z.Level.level;
    const D = Z.Level.DIMS;
    const inside = z.pos[0] > D.X0 && z.pos[0] < D.X1
      && z.pos[2] > D.Z0 && z.pos[2] < D.Z1;

    if (inside) {
      // Already in the building but cut off. Sending it back out to a window
      // is impossible (windows are not walkable nav edges), so relocate it to
      // a barricade's inside drop point that CAN reach the player.
      for (const w of lv.windows) {
        if (!Z.Level.isRoomOpen(w.room)) continue;
        const to = [w.inPos[0], w.floorY + 0.02, w.inPos[2]];
        if (!Z.Nav.pathBetween(to, playerPos, 3000)) continue;
        z.pos[0] = to[0]; z.pos[1] = to[1]; z.pos[2] = to[2];
        z.state = 'hunt';
        z.window = null;
        z.path = null; z.goal = null; z.repathT = 0;
        z.noProgressT = 0; z.bestDist = undefined;
        return;
      }
      // Nothing reachable at all — let it die rather than hang the round.
      S.kill(z, { source: 'stuck', dir: [0, 0, 1] });
      return;
    }

    // Outside: pick a window it can actually walk to and start over.
    let best = null, bestD = 1e9;
    for (const w of lv.windows) {
      if (!Z.Level.isRoomOpen(w.room)) continue;
      const d = M.dist3(w.out, z.pos);
      if (d >= bestD) continue;
      if (!Z.Nav.pathBetween(z.pos, w.out, 3000)) continue;
      bestD = d; best = w;
    }
    if (!best) { S.kill(z, { source: 'stuck', dir: [0, 0, 1] }); return; }
    z.window = best;
    z.state = 'approach';
    z.stateT = 0;
    z.path = null; z.goal = null; z.repathT = 0;
    z.noProgressT = 0; z.bestDist = undefined;
    if (Z.Phys.boxSolid(z.pos, z.radius, z.height)) {
      z.pos[0] = best.out[0]; z.pos[1] = best.out[1] + 0.02; z.pos[2] = best.out[2];
    }
  }

  function updateHunt(z, dt, playerPos) {
    z.anim = z.crawler ? 'crawler' : animForSpeed(z);
    const dist = followFlow(z, playerPos, dt);

    // progress watchdog
    const reachNow = Z.B.PLAYER.zombieAttackRange * 0.85;
    if (z.bestDist === undefined || dist < z.bestDist - 0.25) {
      z.bestDist = dist;
      z.noProgressT = 0;
    } else if (dist > reachNow) {
      z.noProgressT = (z.noProgressT || 0) + dt;
      if (z.noProgressT > NO_PROGRESS_RESET) {
        recoverStuckHunter(z, playerPos);
        z.bestDist = undefined;
        return;
      }
      if (z.noProgressT > NO_PROGRESS_REPATH) {
        z.repathT = 0;
        z.bestDist = dist;      // give the new path a fresh baseline
      }
    }

    const reach = Z.B.PLAYER.zombieAttackRange * 0.85;
    if (dist < reach && Math.abs(z.pos[1] - playerPos[1]) < 1.6 && z.attackCooldown <= 0) {
      z.state = 'attack';
      z.stateT = 0;
      z.attackPhase = 0;
      z.hasHitThisSwing = false;
      z.anim = 'attack';
    }
  }

  const ATTACK_WINDUP = 0.42;   // telegraph — the player must be able to react
  const ATTACK_STRIKE = 0.13;
  const ATTACK_RECOVER = 0.40;
  const ATTACK_TOTAL = ATTACK_WINDUP + ATTACK_STRIKE + ATTACK_RECOVER;

  function updateAttack(z, dt, playerPos) {
    z.anim = 'attack';
    z.attackPhase = M.clamp01(z.stateT / ATTACK_TOTAL);
    faceTowards(z, playerPos);
    // creep forward slowly during the swing so they don't feel frozen
    steerTo(z, playerPos, dt, 0.18);

    if (!z.hasHitThisSwing && z.stateT >= ATTACK_WINDUP) {
      z.hasHitThisSwing = true;
      const d = M.distXZ(z.pos, playerPos);
      if (d < Z.B.PLAYER.zombieAttackRange && Math.abs(z.pos[1] - playerPos[1]) < 1.8) {
        if (Z.Audio && Z.Audio.ready) {
          Z.Audio.play('zom_attack_swipe', { pos: z.pos, vol: 0.85 });
          Z.Audio.play('zom_hit_player', { vol: 0.9 });
        }
        if (player && Z.Player) Z.Player.damage(player, S.hitDamage(), z.pos, 'zombie');
      } else if (Z.Audio && Z.Audio.ready) {
        Z.Audio.play('zom_attack_swipe', { pos: z.pos, vol: 0.55 });
      }
    }
    if (z.stateT >= ATTACK_TOTAL) {
      z.state = 'hunt';
      z.stateT = 0;
      z.attackCooldown = 0.55;
      z.attackPhase = 0;
    }
  }

  // 50 damage: two hits down an unbuffed player, five with Juggernog. This
  // single number is the most load-bearing value in the whole game.
  S.hitDamage = function () { return 50; };

  function faceTowards(z, p) {
    const dx = p[0] - z.pos[0], dz = p[2] - z.pos[2];
    if (Math.abs(dx) + Math.abs(dz) > 0.0001) z.targetYaw = Math.atan2(-dx, -dz);
  }

  function animForSpeed(z) {
    if (z.crawler) return 'crawler';
    if (z.speed < 1.6) return 'shamble';
    if (z.speed < 3.1) return 'walk';
    return 'run';
  }

  // -------------------------------------------------------------------------
  // Rendering
  // -------------------------------------------------------------------------
  const jointBuf = new Float32Array(264);   // 22 joints x mat3x4 (see Z.Models.poseZombie)
  const modelM = M.m4.create();

  S.render = function () {
    if (!Z.Models || !Z.Models.zombie || !S.gpu) return;
    const cam = Z.Render.camera.pos;
    for (const z of S.list) {
      // cheap distance + behind-camera cull
      const d = M.dist3(z.pos, cam);
      if (d > 55) continue;
      const anim = z.dying ? z.deathAnim : z.anim;
      const t = z.dying ? z.deathT : z.animT;
      const vi = z.variant % S.gpu.length;
      const src = S.src[vi];
      // The variant meshes are built with different bone-length scales, so the
      // pose has to be generated at the SAME scale or the skin stretches into
      // a tall smear instead of a body.
      Z.Models.poseZombie(jointBuf, anim, t, {
        speed: z.speed, seed: z.seed, crawler: z.crawler,
        attackPhase: z.attackPhase, limbsMissing: z.limbsMissing,
        stagger: z.stagger, variant: vi,
        heightScale: (src && src.heightScale) || 1,
      });
      M.m4.compose(modelM, z.pos[0], z.pos[1], z.pos[2], z.yaw, 0, 0, 1, 1, 1);
      Z.Render.drawSkinned(S.gpu[vi], modelM, jointBuf, null);
    }
  };

  // Blob shadows are drawn as one batch so they cost a single draw call.
  S.renderShadows = function () {
    Z.Render.beginQuads();
    for (const z of S.list) {
      if (z.dying && z.deathT > 1.5) continue;
      Z.FX.blobShadow(z.pos, z.crawler ? 0.42 : 0.52, 0.5);
    }
    Z.Render.flushQuads('smoke_puff', false, 0.9);
  };

  S.uploadModels = function () {
    if (!Z.Models || !Z.Models.zombie) return false;
    S.gpu = [];
    S.src = [];
    const variants = Z.Models.zombieVariants && Z.Models.zombieVariants.length
      ? Z.Models.zombieVariants : [Z.Models.zombie];
    for (const v of variants) {
      S.gpu.push(Z.Render.uploadMesh(v));
      S.src.push(v);
    }
    S.variantCount = S.gpu.length;
    return true;
  };

  // -------------------------------------------------------------------------
  // Queries used by the round director and HUD
  // -------------------------------------------------------------------------
  S.countAlive = function () {
    let n = 0;
    for (const z of S.list) if (!z.dying && !z.dead) n++;
    return n;
  };
  S.countInside = function () {
    let n = 0;
    for (const z of S.list) if (!z.dying && z.state === 'hunt') n++;
    return n;
  };
  S.nearestTo = function (p, maxDist) {
    let best = null, bestD = maxDist === undefined ? 1e9 : maxDist * maxDist;
    for (const z of S.list) {
      if (z.dying) continue;
      const d = M.dist3sq(z.pos, p);
      if (d < bestD) { bestD = d; best = z; }
    }
    return best;
  };
  S.clear = function () {
    S.list.length = 0;
    S.aliveCount = 0;
    if (level) for (const w of level.windows) w.tearer = null;
  };

  S.stats = function () {
    let tearing = 0, hunting = 0, climbing = 0, approaching = 0, dying = 0;
    for (const z of S.list) {
      if (z.dying) { dying++; continue; }
      if (z.state === 'tear') tearing++;
      else if (z.state === 'hunt' || z.state === 'attack') hunting++;
      else if (z.state === 'climb') climbing++;
      else approaching++;
    }
    return { total: S.list.length, alive: S.countAlive(), tearing, hunting, climbing, approaching, dying };
  };
}());

// ---------------------------------------------------------------------------
// 18_rounds.js — the round director.
//
// Owns the round counter, the spawn budget, the drip-feed of zombies through
// the barricades, and the pacing beats between rounds. The rhythm is the point:
// a hard silence, the round sting, then the first shuffling silhouette at a
// window — and the gap between rounds shrinking as the night goes on.
// ---------------------------------------------------------------------------
(function () {
  const Rd = {};
  Z.Rounds = Rd;
  const M = Z.M;
  const rng = Z.RNG.make(0x0FF17ADD);

  const PHASE_INTRO = 'intro';
  const PHASE_ACTIVE = 'active';
  const PHASE_BETWEEN = 'between';

  let level = null;
  let player = null;

  Rd.round = 0;
  Rd.phase = PHASE_BETWEEN;
  Rd.phaseT = 0;
  Rd.toSpawn = 0;
  Rd.spawnedThisRound = 0;
  Rd.totalThisRound = 0;
  Rd.killsThisRound = 0;
  Rd.spawnTimer = 0;
  Rd.powerupsThisRound = 0;
  Rd.running = false;

  // How long the game holds its breath.
  const INTRO_TIME = 4.2;     // round sting + the walk-up before the first spawn
  const BETWEEN_TIME = 7.0;   // the classic breathing room to buy and re-board

  Rd.init = function (lv, plr) {
    level = lv;
    player = plr;
    Rd.round = 0;
    Rd.phase = PHASE_BETWEEN;
    Rd.phaseT = BETWEEN_TIME - 2.0;   // short first wait so the game starts promptly
    Rd.toSpawn = 0;
    Rd.spawnedThisRound = 0;
    Rd.totalThisRound = 0;
    Rd.killsThisRound = 0;
    Rd.powerupsThisRound = 0;
    Rd.running = true;
    return Rd;
  };

  Rd.start = function () { Rd.running = true; };
  Rd.stop = function () { Rd.running = false; };

  // -------------------------------------------------------------------------
  Rd.update = function (dt) {
    if (!Rd.running) return;
    Rd.phaseT += dt;

    switch (Rd.phase) {
      case PHASE_BETWEEN:
        if (Rd.phaseT >= BETWEEN_TIME) beginRound(Rd.round + 1);
        break;

      case PHASE_INTRO:
        if (Rd.phaseT >= INTRO_TIME) {
          Rd.phase = PHASE_ACTIVE;
          Rd.phaseT = 0;
          Rd.spawnTimer = 0;
        }
        break;

      case PHASE_ACTIVE:
        updateSpawning(dt);
        if (Rd.spawnedThisRound >= Rd.totalThisRound && Z.Zombies.countAlive() === 0) {
          endRound();
        }
        break;
    }
  };

  function beginRound(n) {
    Rd.round = n;
    Rd.phase = PHASE_INTRO;
    Rd.phaseT = 0;
    Rd.totalThisRound = Z.B.roundZombieCount(n, 1);
    Rd.spawnedThisRound = 0;
    Rd.killsThisRound = 0;
    Rd.powerupsThisRound = 0;
    Rd.spawnTimer = 0;

    if (Z.Audio && Z.Audio.ready) {
      Z.Audio.play(n === 1 ? 'round_start' : 'round_start', { vol: 1.0 });
      Z.Audio.duck(0.35, 1.4);
      if (Z.Audio.musicIntensity) Z.Audio.musicIntensity(M.clamp01((n - 1) / 25));
    }
    if (Z.HUD && Z.HUD.notify) Z.HUD.notify('round', { round: n });
    if (Rd.onRoundStart) Rd.onRoundStart(n);
  }

  function endRound() {
    Rd.phase = PHASE_BETWEEN;
    Rd.phaseT = 0;
    if (Z.Audio && Z.Audio.ready) {
      Z.Audio.play('round_end', { vol: 1.0 });
      Z.Audio.duck(0.5, 2.5);
    }
    if (Rd.onRoundEnd) Rd.onRoundEnd(Rd.round);
  }

  // -------------------------------------------------------------------------
  // Spawning
  // -------------------------------------------------------------------------
  function updateSpawning(dt) {
    if (Rd.spawnedThisRound >= Rd.totalThisRound) return;
    const cap = Z.B.maxAlive(1);
    if (Z.Zombies.countAlive() >= cap) return;

    Rd.spawnTimer -= dt;
    if (Rd.spawnTimer > 0) return;

    const win = pickWindow();
    if (!win) { Rd.spawnTimer = 0.4; return; }
    const zone = pickZone(win);
    Z.Zombies.spawn({ round: Rd.round, window: win, zone });
    Rd.spawnedThisRound++;
    Rd.spawnTimer = Z.B.spawnDelay(Rd.round) * rng.range(0.82, 1.18);
  }

  // Zombies come from the windows around wherever the player actually is —
  // spawning them across the map would just produce a long boring walk.
  function pickWindow() {
    const open = [];
    let totalW = 0;
    const pp = player ? player.pos : [0, 0, 0];
    for (const w of level.windows) {
      if (!Z.Level.isRoomOpen(w.room)) continue;
      const d = M.dist3(w.inPos, pp);
      // strong preference for nearby windows, but never zero chance for far
      // ones, so the player can't fully camp a single corner
      let weight = 1 / (1 + d * d * 0.03);
      // spread the load: a window already being worked is less attractive
      if (w.tearer) weight *= 0.45;
      if (w.boards <= 0) weight *= 1.35;   // an open window is the easy way in
      open.push({ w, weight });
      totalW += weight;
    }
    if (!open.length) return null;
    let r = rng.f() * totalW;
    for (const o of open) {
      r -= o.weight;
      if (r <= 0) return o.w;
    }
    return open[open.length - 1].w;
  }

  function pickZone(win) {
    const zones = level.spawnZones.filter((s) => s.windowId === win.id);
    if (!zones.length) return null;
    return zones[rng.i(zones.length)];
  }

  // -------------------------------------------------------------------------
  Rd.notifyKill = function () {
    Rd.killsThisRound++;
  };

  Rd.zombiesRemaining = function () {
    return Math.max(0, Rd.totalThisRound - Rd.spawnedThisRound) + Z.Zombies.countAlive();
  };

  Rd.timeToNextRound = function () {
    return Rd.phase === PHASE_BETWEEN ? Math.max(0, BETWEEN_TIME - Rd.phaseT) : 0;
  };

  // Debug / harness: jump straight to a round.
  Rd.setRound = function (n) {
    Z.Zombies.clear();
    Rd.round = n - 1;
    Rd.phase = PHASE_BETWEEN;
    Rd.phaseT = BETWEEN_TIME;   // next update starts round n
  };

  Rd.skipToNextRound = function () {
    Z.Zombies.killAll('debug');
    Rd.spawnedThisRound = Rd.totalThisRound;
  };

  Rd.stats = function () {
    return {
      round: Rd.round, phase: Rd.phase, phaseT: Rd.phaseT,
      spawned: Rd.spawnedThisRound, total: Rd.totalThisRound,
      alive: Z.Zombies.countAlive(), remaining: Rd.zombiesRemaining(),
      health: Z.B.roundHealth(Math.max(1, Rd.round)),
      speed: Z.B.zombieSpeed(Math.max(1, Rd.round)),
    };
  };
}());


/* ============================ 19_econ.js (611 lines) ============================ */
// ---------------------------------------------------------------------------
// 19_econ.js — everything you spend points on, plus the barricades.
//
// Wall buys, the Mystery Box ritual, Perk-a-Cola machines, power-up drops and
// board repair all live here, along with the single "what am I looking at"
// interaction scan the HUD prompt is driven from.
// ---------------------------------------------------------------------------
(function () {
  const E = {};
  Z.Econ = E;
  const M = Z.M;
  const rng = Z.RNG.make(0xB0F5EED);

  let level = null;
  let player = null;

  E.powerups = [];
  E.box = null;
  E.machines = [];
  E.hums = [];

  const USE_RANGE = 2.6;
  const USE_DOT = 0.62;        // must be roughly facing it

  // -------------------------------------------------------------------------
  E.init = function (lv, plr) {
    level = lv;
    player = plr;
    E.powerups.length = 0;
    rng.reseed(0xB0F5EED);

    E.box = {
      spotIndex: rng.i(lv.boxSpots.length),
      state: 'idle',           // idle | opening | spinning | offering | closing | moving
      t: 0,
      uses: 0,
      offer: null,
      spinId: null,
      spinT: 0,
      teddy: false,
      fireSale: false,
    };
    E.box.pos = lv.boxSpots[E.box.spotIndex].pos.slice();
    E.box.yaw = lv.boxSpots[E.box.spotIndex].yaw;

    E.machines = lv.perkSpots.map((s) => ({
      id: s.id, pos: s.pos.slice(), yaw: s.yaw, room: s.room,
      cost: perkCost(s.id), purchases: 0, drinkT: 0,
    }));

    for (const w of lv.windows) { w.boards = w.maxBoards; w.tearer = null; }
    buildMeshes();
    return E;
  };

  function perkCost(id) {
    const p = Z.B.PERKS.find((x) => x.id === id);
    return p ? p.cost : 2000;
  }

  // -------------------------------------------------------------------------
  // Local fallback geometry, so the game is complete even if the model module
  // has nothing for a given prop.
  // -------------------------------------------------------------------------
  let plankMesh = null, boxMesh = null, machineMesh = null, orbMesh = null, panelMesh = null;

  function buildMeshes() {
    if (plankMesh) return;
    if (!Z.Render || !Z.Render.uploadMesh) return;

    let b = Z.Mesh.builder();
    b.setColor(1, 1, 1);
    b.box([-0.5, -0.5, -0.5], [0.5, 0.5, 0.5], { uvScale: 1 });
    plankMesh = Z.Render.uploadMesh(b.finish('wood_plank'));

    b = Z.Mesh.builder();
    b.box([-0.5, 0, -0.35], [0.5, 0.62, 0.35], { uvScale: 1 });
    boxMesh = Z.Render.uploadMesh(b.finish('mystery_box'));

    b = Z.Mesh.builder();
    b.box([-0.42, 0, -0.32], [0.42, 1.95, 0.32], { uvScale: 0.6 });
    machineMesh = Z.Render.uploadMesh(b.finish('metal_rusty'));

    b = Z.Mesh.builder();
    b.cyl(0, 0, 0.16, 0.16, -0.16, 0.16, 10, { uvScale: 1 });
    orbMesh = Z.Render.uploadMesh(b.finish('concrete'));

    // Centred unit plate: composing a base-anchored box for the perk panel
    // left it hovering above the machine instead of set into its front.
    b = Z.Mesh.builder();
    // uvOffset puts u,v in 0..1 across the plate; without it the -0.5..0.5
    // world range wraps and you see four quadrants of the label at once.
    b.box([-0.5, -0.5, -0.02], [0.5, 0.5, 0.02], { uvScale: 1, uvOffset: [0.5, 0.5] });
    panelMesh = Z.Render.uploadMesh(b.finish('perk_jugg'));

    // Upload the real prop meshes. Without this every prop silently fell back
    // to the crude placeholder box above.
    if (Z.Models && Z.Models.props) {
      for (const k in Z.Models.props) {
        const pr = Z.Models.props[k];
        if (pr && pr.verts && !pr.gpu) pr.gpu = Z.Render.uploadMesh(pr);
      }
    }
    if (Z.Models && Z.Models.guns) {
      for (const k in Z.Models.guns) {
        const g = Z.Models.guns[k];
        if (g && g.mesh && !g.gpu) g.gpu = Z.Render.uploadMesh(g.mesh);
      }
    }
  }

  // -------------------------------------------------------------------------
  // Interaction scan
  // -------------------------------------------------------------------------
  // Returns the single best thing the player could act on right now, or null.
  E.findInteraction = function (p, eye, dir) {
    let best = null, bestScore = -1;

    const consider = (cand, pos) => {
      const dx = pos[0] - eye[0], dy = pos[1] - eye[1], dz = pos[2] - eye[2];
      const dist = Math.hypot(dx, dy, dz);
      if (dist > USE_RANGE) return;
      const dot = (dx * dir[0] + dy * dir[1] + dz * dir[2]) / Math.max(dist, 0.001);
      if (dot < USE_DOT) return;
      const score = dot * 2 - dist * 0.2;
      if (score > bestScore) { bestScore = score; best = cand; }
    };

    // --- wall buys and debris ---------------------------------------------
    for (const buy of level.buys) {
      if (buy.kind === 'debris' && buy.bought) continue;
      const pos = buy.pos;
      if (buy.kind === 'weapon') {
        const isGrenade = buy.id === Z.B.GRENADE.id;
        const held = !isGrenade && p.weapons.find((w) => w.id === buy.id);
        let cost, label;
        if (isGrenade) {
          cost = Z.B.GRENADE.wallCost;
          label = 'Buy ' + Z.B.GRENADE.name + ' [' + cost + ']';
          if (p.grenades >= Z.B.GRENADE.maxCount) continue;
        } else if (held) {
          cost = Z.B.ammoRefillCost(buy.id) || Math.round(buy.cost * 0.5);
          label = 'Buy ' + Z.W.def(buy.id).name + ' Ammo [' + cost + ']';
          if (held.reserve >= held.def.maxReserve) continue;
        } else {
          cost = buy.cost;
          label = 'Buy ' + Z.W.def(buy.id).name + ' [' + cost + ']';
        }
        consider({ kind: 'wallbuy', buy, cost, label, hold: false }, pos);
      } else if (buy.kind === 'debris') {
        consider({
          kind: 'debris', buy, cost: buy.cost,
          label: 'Clear Debris [' + buy.cost + ']', hold: false,
        }, pos);
      }
    }

    // --- perk machines -----------------------------------------------------
    for (const mch of E.machines) {
      if (p.perks[mch.id]) continue;
      const perk = Z.B.PERKS.find((x) => x.id === mch.id);
      let cost = mch.cost;
      // Solo Quick Revive doubles each time, as in the real game.
      if (mch.id === 'quickrevive' && perk && perk.soloPriceDoubles) {
        cost = mch.cost * Math.pow(2, mch.purchases);
      }
      consider({
        kind: 'perk', machine: mch, cost,
        label: 'Buy ' + (perk ? perk.name : mch.id) + ' [' + cost + ']', hold: false,
      }, [mch.pos[0], mch.pos[1] + 1.1, mch.pos[2]]);
    }

    // --- mystery box -------------------------------------------------------
    if (E.box.state === 'idle') {
      consider({
        kind: 'box', cost: Z.B.BOX.cost,
        label: 'Mystery Box [' + Z.B.BOX.cost + ']', hold: false,
      }, [E.box.pos[0], E.box.pos[1] + 0.7, E.box.pos[2]]);
    } else if (E.box.state === 'offering' && E.box.offer) {
      consider({
        kind: 'boxtake', cost: 0,
        label: 'Take ' + Z.W.def(E.box.offer).name, hold: false,
      }, [E.box.pos[0], E.box.pos[1] + 1.25, E.box.pos[2]]);
    }

    // --- barricades --------------------------------------------------------
    for (const w of level.windows) {
      if (w.boards >= w.maxBoards) continue;
      const pos = [w.pos[0], w.pos[1], w.pos[2]];
      const d = M.dist3(p.pos, w.repairFrom);
      if (d > 1.9) continue;
      consider({
        kind: 'repair', window: w, cost: 0,
        label: 'Hold to Rebuild Barricade', hold: true,
      }, pos);
    }

    return best;
  };

  // -------------------------------------------------------------------------
  // Using
  // -------------------------------------------------------------------------
  E.use = function (p, act) {
    if (!act) return false;
    switch (act.kind) {
      case 'wallbuy': return buyWall(p, act);
      case 'debris': return buyDebris(p, act);
      case 'perk': return buyPerk(p, act);
      case 'box': return buyBox(p, act);
      case 'boxtake': return takeBox(p);
      default: return false;
    }
  };

  function buyWall(p, act) {
    const buy = act.buy;
    if (!p.canAfford && !Z.Player.canAfford(p, act.cost)) { fail(); return false; }
    if (!Z.Player.spend(p, act.cost)) return false;
    if (buy.id === Z.B.GRENADE.id) {
      p.grenades = Z.B.GRENADE.maxCount;
      if (Z.Audio && Z.Audio.ready) Z.Audio.play('buy_ammo', { pos: buy.pos, vol: 0.8 });
      return true;
    }
    const held = p.weapons.find((w) => w.id === buy.id);
    if (held) {
      Z.W.giveAmmo(held, true);
      if (Z.Audio && Z.Audio.ready) Z.Audio.play('buy_ammo', { pos: buy.pos, vol: 0.8 });
    } else {
      Z.Player.giveWeapon(p, buy.id);
      if (Z.Audio && Z.Audio.ready) Z.Audio.play('buy_weapon', { pos: buy.pos, vol: 0.9 });
    }
    return true;
  }

  function buyDebris(p, act) {
    if (!Z.Player.spend(p, act.cost)) return false;
    const id = act.buy.id;
    Z.Level.removeDebris(id);
    // The world changed: rebuild collision, render chunks and navigation.
    Z.Phys.setLevel(Z.Level.level);
    Z.Render.loadLevel(Z.Level.level);
    Z.Nav.build(Z.Level.level);
    if (Z.Audio && Z.Audio.ready) Z.Audio.play('debris_clear', { pos: act.buy.pos, vol: 1.0 });
    Z.FX.splinters(act.buy.pos, [0, 1, 0], 22);
    Z.FX.shake(0.35, 0.5);
    if (E.onDebrisCleared) E.onDebrisCleared(id);
    return true;
  }

  function buyPerk(p, act) {
    if (!Z.Player.spend(p, act.cost)) return false;
    const mch = act.machine;
    mch.purchases++;
    mch.drinkT = 1.6;
    Z.Player.givePerk(p, mch.id);
    if (Z.Audio && Z.Audio.ready) {
      Z.Audio.play('perk_buy', { pos: mch.pos, vol: 0.9 });
      Z.Audio.play('perk_drink', { vol: 0.9, delay: 0.35 });
      const jingle = { juggernog: 'perk_jingle_jugg', speedcola: 'perk_jingle_speed',
        doubletap: 'perk_jingle_double', quickrevive: 'perk_jingle_revive' }[mch.id];
      if (jingle) Z.Audio.play(jingle, { pos: mch.pos, vol: 0.7 });
    }
    if (Z.HUD && Z.HUD.notify) Z.HUD.notify('perk', { id: mch.id });
    return true;
  }

  function fail() {
    if (Z.Audio && Z.Audio.ready) Z.Audio.play('buy_fail', { vol: 0.7 });
  }

  // -------------------------------------------------------------------------
  // Mystery Box
  // -------------------------------------------------------------------------
  function buyBox(p, act) {
    if (!Z.Player.spend(p, act.cost)) return false;
    const b = E.box;
    b.uses++;
    b.state = 'opening';
    b.t = 0;
    b.spinT = 0;
    // Teddy bear: only after a minimum number of uses, then a flat chance.
    b.teddy = b.uses > Z.B.BOX.teddyBearMinUses && rng.f() < Z.B.BOX.teddyBearChance;
    b.offer = b.teddy ? null : Z.B.rollBoxWeapon ? Z.B.rollBoxWeapon(rng.f()) : rollWeapon();
    if (Z.Audio && Z.Audio.ready) {
      Z.Audio.play('box_open', { pos: b.pos, vol: 0.95 });
      Z.Audio.play('box_jingle', { pos: b.pos, vol: 0.6, delay: 0.25 });
    }
    return true;
  }

  function rollWeapon() {
    const weights = Z.B.BOX.weights;
    let total = 0;
    for (const k in weights) total += weights[k];
    let r = rng.f() * total;
    for (const k in weights) { r -= weights[k]; if (r <= 0) return k; }
    return 'mp40';
  }

  function takeBox(p) {
    const b = E.box;
    if (!b.offer) return false;
    Z.Player.giveWeapon(p, b.offer);
    if (Z.Audio && Z.Audio.ready) Z.Audio.play('buy_weapon', { pos: b.pos, vol: 0.95 });
    b.offer = null;
    b.state = 'closing';
    b.t = 0;
    return true;
  }

  function updateBox(dt) {
    const b = E.box;
    b.t += dt;
    switch (b.state) {
      case 'opening':
        if (b.t > 0.55) { b.state = 'spinning'; b.t = 0; b.spinT = 0; }
        break;
      case 'spinning': {
        b.spinT += dt;
        // cycle the displayed weapon, slowing down as it settles
        const rate = M.lerp(14, 2.2, M.clamp01(b.spinT / 4.0));
        b.spinAccum = (b.spinAccum || 0) + dt * rate;
        if (b.spinAccum > 1) {
          b.spinAccum = 0;
          b.spinId = rollWeapon();
          if (Z.Audio && Z.Audio.ready) Z.Audio.play('box_spin', { pos: b.pos, vol: 0.35 });
        }
        if (b.spinT > 4.2) {
          if (b.teddy) {
            b.state = 'moving';
            b.t = 0;
            if (Z.Audio && Z.Audio.ready) Z.Audio.play('box_teddy', { pos: b.pos, vol: 1.0 });
          } else {
            b.state = 'offering';
            b.t = 0;
            b.spinId = b.offer;
            if (Z.Audio && Z.Audio.ready) Z.Audio.play('box_land', { pos: b.pos, vol: 0.9 });
          }
        }
        break;
      }
      case 'offering':
        // The weapon hangs there for a while; miss the window and it's gone.
        if (b.t > 11) { b.state = 'closing'; b.t = 0; b.offer = null; }
        break;
      case 'closing':
        if (b.t > 0.7) { b.state = 'idle'; b.t = 0; }
        if (b.t > 0.05 && !b.closeSfx) {
          b.closeSfx = true;
          if (Z.Audio && Z.Audio.ready) Z.Audio.play('box_close', { pos: b.pos, vol: 0.8 });
        }
        break;
      case 'moving':
        if (b.t > 2.2) {
          let next = rng.i(level.boxSpots.length);
          if (level.boxSpots.length > 1) {
            while (next === b.spotIndex) next = rng.i(level.boxSpots.length);
          }
          b.spotIndex = next;
          b.pos = level.boxSpots[next].pos.slice();
          b.yaw = level.boxSpots[next].yaw;
          b.state = 'idle';
          b.t = 0;
          b.uses = 0;
          b.teddy = false;
          if (E.onBoxMoved) E.onBoxMoved(b);
        }
        break;
      default:
        b.closeSfx = false;
        break;
    }
  }

  // -------------------------------------------------------------------------
  // Barricade repair
  // -------------------------------------------------------------------------
  E.updateRepair = function (p, act, held, dt) {
    if (!act || act.kind !== 'repair' || !held) {
      p.repairProgress = 0;
      p.repairTarget = null;
      return false;
    }
    const w = act.window;
    if (p.repairTarget !== w) { p.repairTarget = w; p.repairProgress = 0; }
    p.repairProgress += dt;
    const per = Z.B.BARRICADE.repairTimePerBoard;
    if (p.repairProgress >= per) {
      p.repairProgress -= per;
      w.boards = Math.min(w.maxBoards, w.boards + 1);
      p.boardsRepaired++;
      Z.Player.award(p, Z.B.POINTS.repairBoard, 'repair');
      if (Z.Audio && Z.Audio.ready) {
        Z.Audio.play('board_repair', { pos: w.pos, vol: 0.9, rate: 0.95 + w.boards * 0.03 });
      }
      if (w.boards >= w.maxBoards) { p.repairProgress = 0; return true; }
    }
    return true;
  };

  // -------------------------------------------------------------------------
  // Power-ups
  // -------------------------------------------------------------------------
  const LIFETIME = 30, BLINK_AT = 5;

  E.maybeDrop = function (z, round) {
    if (Z.Rounds.powerupsThisRound >= 4) return null;
    // Drop rate ramps a little with the round, as the real game's does.
    const chance = 0.02 + Math.min(0.02, round * 0.0012);
    if (rng.f() > chance) return null;
    return E.dropPowerup(z.pos);
  };

  E.dropPowerup = function (at, forceId) {
    const defs = Z.B.POWERUPS;
    let id = forceId;
    if (!id) {
      let total = 0;
      for (const d of defs) total += d.weight;
      let r = rng.f() * total;
      for (const d of defs) { r -= d.weight; if (r <= 0) { id = d.id; break; } }
    }
    const def = defs.find((d) => d.id === id) || defs[0];
    const floor = Z.Phys.floorAt([at[0], at[1] + 1.0, at[2]], 4, 0.2);
    const pu = {
      id: def.id, def,
      pos: [at[0], (floor === null ? at[1] : floor) + 0.75, at[2]],
      t: 0, life: LIFETIME, taken: false, bob: rng.f() * 6,
    };
    E.powerups.push(pu);
    Z.Rounds.powerupsThisRound++;
    if (Z.Audio && Z.Audio.ready) Z.Audio.play('powerup_drop', { pos: pu.pos, vol: 0.8 });
    return pu;
  };

  E.instaKillT = 0;
  E.doublePointsT = 0;

  function updatePowerups(dt, p) {
    for (let i = E.powerups.length - 1; i >= 0; i--) {
      const pu = E.powerups[i];
      pu.t += dt;
      if (pu.t >= pu.life) { E.powerups.splice(i, 1); continue; }
      if (M.dist3(pu.pos, [p.pos[0], p.pos[1] + 0.9, p.pos[2]]) < 1.7) {
        grabPowerup(pu, p);
        E.powerups.splice(i, 1);
      }
    }
    if (E.instaKillT > 0) {
      E.instaKillT -= dt;
      if (E.instaKillT <= 0) { E.instaKillT = 0; Z.Zombies.instaKill = false; }
    }
    if (E.doublePointsT > 0) {
      E.doublePointsT = Math.max(0, E.doublePointsT - dt);
    }
  }

  function grabPowerup(pu, p) {
    if (Z.Audio && Z.Audio.ready) {
      Z.Audio.play('powerup_grab', { vol: 0.9 });
      Z.Audio.play('powerup_' + pu.id, { vol: 1.0 });
    }
    if (Z.HUD && Z.HUD.notify) Z.HUD.notify('powerup', { id: pu.id, name: pu.def.name });
    switch (pu.id) {
      case 'instakill':
        E.instaKillT = pu.def.duration;
        Z.Zombies.instaKill = true;
        break;
      case 'doublepoints':
        E.doublePointsT = pu.def.duration;
        break;
      case 'maxammo':
        for (const w of p.weapons) Z.W.maxAmmo(w);
        p.grenades = Z.B.GRENADE.maxCount;
        break;
      case 'nuke': {
        const n = Z.Zombies.killAll('nuke');
        Z.Player.award(p, pu.def.killPoints || 400, 'nuke');
        Z.FX.shake(0.9, 0.9);
        if (E.onNuke) E.onNuke(n);
        break;
      }
      case 'carpenter':
        for (const w of Z.Level.level.windows) w.boards = w.maxBoards;
        Z.Player.award(p, 200, 'carpenter');
        if (Z.Audio && Z.Audio.ready) Z.Audio.play('board_repair', { vol: 0.9 });
        break;
    }
  }

  E.pointsMultiplier = () => (E.doublePointsT > 0 ? 2 : 1);

  // -------------------------------------------------------------------------
  E.update = function (dt, p) {
    updateBox(dt);
    updatePowerups(dt, p);
    for (const m of E.machines) if (m.drinkT > 0) m.drinkT = Math.max(0, m.drinkT - dt);
  };

  // -------------------------------------------------------------------------
  // Rendering
  // -------------------------------------------------------------------------
  const mm = M.m4.create();

  E.render = function () {
    if (!plankMesh) buildMeshes();
    if (!plankMesh) return;

    // --- barricade boards --------------------------------------------------
    for (const w of level.windows) {
      for (let i = 0; i < w.boards; i++) {
        const s = w.boardSlots[i];
        if (!s) continue;
        M.m4.compose(mm, s.pos[0], s.pos[1], s.pos[2], s.yaw, 0, s.roll, s.len, s.w, s.t);
        Z.Render.drawMesh(plankMesh, mm, { mat: 'wood_plank' });
      }
    }

    // --- mystery box -------------------------------------------------------
    const b = E.box;
    const lidOpen = (b.state === 'opening') ? M.clamp01(b.t / 0.55)
      : (b.state === 'spinning' || b.state === 'offering') ? 1
        : (b.state === 'closing') ? 1 - M.clamp01(b.t / 0.7) : 0;
    if (b.state !== 'moving' || b.t < 1.6) {
      const boxProp = Z.Models && Z.Models.props && Z.Models.props.mystery_box;
      M.m4.compose(mm, b.pos[0], b.pos[1], b.pos[2], b.yaw, 0, 0, 1, 1, 1);
      Z.Render.drawMesh(boxProp ? boxProp.gpu || boxMesh : boxMesh, mm, { mat: 'mystery_box' });
      if (lidOpen > 0.02) {
        // shaft of light out of the open box
        Z.Render.addLight([b.pos[0], b.pos[1] + 1.0, b.pos[2]], [0.95, 0.85, 0.55], 5.5, 1.4 * lidOpen);
      }
    }
    // the weapon hovering above an open box
    if ((b.state === 'spinning' || b.state === 'offering') && (b.spinId || b.offer)) {
      const id = b.state === 'offering' ? b.offer : b.spinId;
      const gun = Z.Models && Z.Models.guns && Z.Models.guns[id];
      const y = b.pos[1] + 1.25 + Math.sin(Z.Render.time * 2.2) * 0.05;
      if (gun && gun.gpu) {
        M.m4.compose(mm, b.pos[0], y, b.pos[2], Z.Render.time * 1.4, 0, 0, 1, 1, 1);
        Z.Render.drawMesh(gun.gpu, mm, null);
      } else {
        M.m4.compose(mm, b.pos[0], y, b.pos[2], Z.Render.time * 1.4, 0, 0, 0.9, 0.22, 0.22);
        Z.Render.drawMesh(boxMesh, mm, { mat: 'gun_metal' });
      }
    }

    // --- perk machines -----------------------------------------------------
    for (const m of E.machines) {
      const prop = Z.Models && Z.Models.props && Z.Models.props['perk_machine_' + shortPerk(m.id)];
      M.m4.compose(mm, m.pos[0], m.pos[1], m.pos[2], m.yaw, 0, 0, 1, 1, 1);
      Z.Render.drawMesh(prop && prop.gpu ? prop.gpu : machineMesh, mm, { mat: 'metal_rusty' });
      // lit front panel, set into the machine's face
      M.m4.compose(mm, m.pos[0] + Math.sin(m.yaw) * 0.32, m.pos[1] + 1.16,
        m.pos[2] + Math.cos(m.yaw) * 0.32, m.yaw, 0, 0, 0.62, 0.86, 1);
      Z.Render.drawMesh(panelMesh, mm, { mat: panelMat(m.id), emissive: 0.85 });
      Z.Render.addLight([m.pos[0], m.pos[1] + 1.3, m.pos[2]], perkLight(m.id), 3.4, 0.6);
    }
  };

  function shortPerk(id) {
    return { juggernog: 'jugg', speedcola: 'speed', doubletap: 'doubletap', quickrevive: 'revive' }[id] || id;
  }
  function panelMat(id) {
    return { juggernog: 'perk_jugg', speedcola: 'perk_speed',
      doubletap: 'perk_doubletap', quickrevive: 'perk_revive' }[id] || 'perk_jugg';
  }
  function perkLight(id) {
    return { juggernog: [1.0, 0.18, 0.16], speedcola: [0.25, 1.0, 0.35],
      doubletap: [1.0, 0.72, 0.18], quickrevive: [0.42, 0.72, 1.0] }[id] || [1, 1, 1];
  }

  // Power-ups are billboards so they read from any angle, like the real ones.
  E.renderPowerups = function () {
    if (!E.powerups.length) return;
    const t = Z.Render.time;
    // Group by icon so each type is one additive draw call.
    const byIcon = Object.create(null);
    for (const pu of E.powerups) {
      (byIcon[pu.id] = byIcon[pu.id] || []).push(pu);
    }
    for (const id in byIcon) {
      Z.Render.beginQuads();
      for (const pu of byIcon[id]) {
        const remain = pu.life - pu.t;
        // blink out over the last few seconds, exactly like the real drops
        const alpha = remain < BLINK_AT ? ((Math.sin(remain * 18) > 0) ? 1 : 0.15) : 1;
        const y = pu.pos[1] + Math.sin(t * 2.4 + pu.bob) * 0.07;
        const size = 0.42 + Math.sin(t * 3.1 + pu.bob) * 0.02;
        Z.Render.billboard([pu.pos[0], y, pu.pos[2]], [size, size], [1, 1, 1, alpha]);
        Z.Render.addLight([pu.pos[0], y, pu.pos[2]], powerupLight(id), 4.5, 0.9 * alpha);
      }
      Z.Render.flushQuads('powerup_icon_' + id, true, 0.4);
    }
  };

  function powerupLight(id) {
    return { instakill: [1.0, 0.25, 0.2], doublepoints: [1.0, 0.9, 0.35],
      maxammo: [0.4, 1.0, 0.45], nuke: [1.0, 0.75, 0.3],
      carpenter: [0.7, 0.55, 0.35] }[id] || [1, 1, 1];
  }

  E.stats = function () {
    return {
      box: { state: E.box.state, uses: E.box.uses, spot: E.box.spotIndex, offer: E.box.offer },
      powerups: E.powerups.length,
      instaKill: E.instaKillT, doublePoints: E.doublePointsT,
    };
  };
}());
